<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI și machine learning de la zero</title>
<link rel="alternate" hreflang="ro" href="ro/">
<link rel="alternate" hreflang="en" href="en/">
<script>
var l = null;
try { l = localStorage.getItem("lang"); } catch (e) {}
if (l !== "ro" && l !== "en") l = /^ro\b/i.test(navigator.language || "") ? "ro" : "en";
location.replace(l + "/" + location.hash);
</script>
<style>body{margin:0;padding:40px 16px;font:18px/1.6 system-ui,sans-serif;text-align:center}</style>
</head>
<body>
<p><a href="ro/">Română</a> &middot; <a href="en/">English</a></p>
</body>
</html>
